<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relay101 Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #07111d;
      --bg1: #0f2236;
      --bg2: #14304e;
      --card: rgba(6, 21, 35, 0.8);
      --line: rgba(120, 159, 196, 0.32);
      --txt: #d8ecff;
      --muted: #95b8d8;
      --ok: #56dc97;
      --warn: #ffd166;
      --bad: #ff6b6b;
      --accent: #58d3ff;
      --mono: "IBM Plex Mono", monospace;
      --sans: "Space Grotesk", sans-serif;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--txt);
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(59, 140, 255, 0.22), transparent 55%),
        radial-gradient(1000px 500px at -15% 120%, rgba(0, 210, 180, 0.18), transparent 60%),
        linear-gradient(145deg, var(--bg0), var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 18px;
    }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 14px;
    }
    .top { grid-column: 1 / -1; }
    .kpis { grid-column: 1 / -1; }
    .services { grid-column: 1 / 8; }
    .system { grid-column: 8 / -1; }
    .candidates { grid-column: 1 / 8; }
    .assessment { grid-column: 8 / -1; }
    .events { grid-column: 1 / 8; }
    .security { grid-column: 8 / -1; }
    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
    }
    h1, h2, h3 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    h1 { font-size: 26px; }
    h2 { font-size: 16px; color: var(--muted); font-weight: 500; }
    h3 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input, button {
      font-family: var(--mono);
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(9, 24, 39, 0.92);
      color: var(--txt);
      padding: 10px 12px;
    }
    input { min-width: 280px; }
    button {
      cursor: pointer;
      font-weight: 500;
      transition: transform 140ms ease, border-color 140ms ease;
    }
    button:hover { transform: translateY(-1px); border-color: var(--accent); }
    .status {
      font-family: var(--mono);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      background: rgba(8, 18, 30, 0.85);
    }
    .status.ok { color: var(--ok); border-color: rgba(86, 220, 151, 0.5); }
    .status.warn { color: var(--warn); border-color: rgba(255, 209, 102, 0.5); }
    .status.bad { color: var(--bad); border-color: rgba(255, 107, 107, 0.5); }
    .kpi-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }
    .kpi {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(7, 19, 31, 0.75);
    }
    .kpi .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .kpi .value {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 21px;
    }
    .mono { font-family: var(--mono); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12px;
    }
    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(130, 162, 192, 0.15);
      text-align: left;
    }
    th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .scroll {
      max-height: 260px;
      overflow: auto;
    }
    .list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 280px;
      overflow: auto;
    }
    .list li {
      border: 1px solid rgba(130, 162, 192, 0.16);
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      background: rgba(8, 20, 33, 0.85);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      margin-right: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tag.ok { color: var(--ok); border-color: rgba(86, 220, 151, 0.45); }
    .tag.warn { color: var(--warn); border-color: rgba(255, 209, 102, 0.45); }
    .tag.bad { color: var(--bad); border-color: rgba(255, 107, 107, 0.45); }
    canvas {
      width: 100%;
      height: 120px;
      background: rgba(5, 13, 21, 0.75);
      border-radius: 10px;
      border: 1px solid rgba(130, 162, 192, 0.22);
    }
    .faded { color: var(--muted); }
    @media (max-width: 1040px) {
      .services, .system, .candidates, .assessment, .events, .security { grid-column: 1 / -1; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      input { min-width: 200px; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="grid">
    <section class="panel top">
      <div class="title">
        <div>
          <h1>Relay101 Control Room</h1>
          <h2>Autonomous Solana Ops + Security</h2>
        </div>
        <span id="wsStatus" class="status warn">DISCONNECTED</span>
      </div>
      <div class="controls">
        <input id="token" placeholder="AUTH_TOKEN" />
        <button id="connectBtn">Connect</button>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="refreshBtn">Refresh State</button>
      </div>
    </section>

    <section class="panel kpis">
      <h3>Runtime KPIs</h3>
      <div class="kpi-grid" id="kpis"></div>
    </section>

    <section class="panel services">
      <h3>Services</h3>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Service</th><th>Running</th><th>Heartbeat</th><th>Error</th></tr>
          </thead>
          <tbody id="servicesBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel system">
      <h3>System Pulse</h3>
      <canvas id="equityChart" width="900" height="120"></canvas>
      <div class="mono faded" id="systemSummary" style="margin-top: 10px;"></div>
    </section>

    <section class="panel candidates">
      <h3>Top Candidates</h3>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Token</th><th>Score</th><th>Velocity</th><th>Inflow/min</th><th>Buyers</th><th>Updated</th></tr>
          </thead>
          <tbody id="candidatesBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel assessment">
      <h3>Latest Assessment</h3>
      <pre class="mono" id="assessmentBox">{}</pre>
    </section>

    <section class="panel events">
      <h3>Recent Events</h3>
      <ul id="eventsList" class="list"></ul>
    </section>

    <section class="panel security">
      <h3>Security Alerts</h3>
      <ul id="alertsList" class="list"></ul>
    </section>
  </main>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
